    <!-- Keep this page out of search results, but let crawlers keep following
         the outbound link to nicolamarmugi.com, which is the site meant to
         rank for the name. Do not add a canonical alongside this: the two are
         conflicting signals. -->
    <meta name="robots" content="noindex, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nicola Marmugi" />
    <meta property="og:title" content="Nicola Marmugi | Front End Developer" />

      property="og:description"
      content="Product interfaces in React, Next.js and TypeScript. Based in Viareggio, Italy."
    />

    <meta property="og:url" content="%SITE_ORIGIN%/" />

    <meta property="og:image:width" content="1200" />
